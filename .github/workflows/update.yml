name: Actualizar vuelos XA-UWK

# Descarga del historial abierto de adsb.lol los dias nuevos (se publican a diario),
# reconstruye los vuelos y revisa la posicion actual. Si el avion esta volando,
# inicia el seguimiento en vivo (live.yml). Tambien se lanza desde la app.
on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 min
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-flights
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar trazas de adsb.lol y reconstruir vuelos
        env:
          HISTORY_DAYS: "366"
          TIME_BUDGET: "2700"
        run: python scripts/adsb_history.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar vuelos XA-UWK"
            git pull --rebase origin main
            git push
          fi
      - name: Iniciar seguimiento en vivo si el avion esta volando
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          volando=$(python3 -c "import json,time; l=json.load(open('data/live.json')).get('last') or {}; print(1 if l and not l.get('ground') and not l.get('historic') and time.time()-l.get('t',0) < 900 else 0)")
          if [ "$volando" = "1" ]; then
            activos=$(gh run list --workflow live.yml --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
            if [ "$activos" = "0" ]; then gh workflow run live.yml && echo "Seguimiento en vivo iniciado"; else echo "Seguimiento ya activo"; fi
          else
            echo "El avion no esta volando"
          fi
