name: Actualizar vuelos XA-UWK

# Descarga del historial abierto de adsb.lol los dias nuevos (se publican a diario)
# y reconstruye los vuelos. La primera corrida puede tardar ~30 min (un año).
on:
  schedule:
    - cron: "23 */3 * * *"   # cada 3 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-flights
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar trazas de adsb.lol y reconstruir vuelos
        env:
          HISTORY_DAYS: "366"
          TIME_BUDGET: "2700"
        run: python scripts/adsb_history.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar vuelos XA-UWK"
            git pull --rebase origin main
            git push
          fi
