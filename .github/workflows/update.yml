name: Actualizar vuelos XA-UWK

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:
    inputs:
      max_consultas:
        description: "Consultas de historial en esta corrida (30 creditos c/u)"
        required: false
        default: "60"

permissions:
  contents: write

concurrency:
  group: update-flights
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar vuelos de OpenSky
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          HISTORY_DAYS: "365"
          MAX_BACKFILL: ${{ github.event.inputs.max_consultas || '25' }}
        run: python scripts/fetch_flights.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Actualizar vuelos XA-UWK"
          git pull --rebase origin main
          git push
